<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nébula — praça pra andar e conversar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#0a0e27;
    --bg-panel:#12183a;
    --bg-panel-2:#1a2150;
    --line: #2b3470;
    --nebula:#8b5cf6;
    --nebula-soft:#a78bfa;
    --gold:#ffc857;
    --pink:#ff6fa5;
    --text:#eef0ff;
    --text-dim:#9aa3d6;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg-deep);
    color:var(--text);
    font-family:'Space Grotesk', sans-serif;
    overflow:hidden;
  }
  .pixel{ font-family:'Press Start 2P', monospace; }

  #stars{ position:fixed; inset:0; z-index:0; pointer-events:none; }

  #app{
    position:relative; z-index:1; height:100%; width:100%;
    display:flex; align-items:center; justify-content:center;
  }

  /* ---------- LOGIN ---------- */
  .screen{
    width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    animation: fadeIn .5s ease;
  }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }

  .card{
    background:linear-gradient(180deg, var(--bg-panel), var(--bg-panel-2));
    border:2px solid var(--line);
    border-radius:14px;
    padding:32px 34px;
    width:min(440px, 92vw);
    box-shadow: 0 0 0 1px rgba(139,92,246,.08), 0 30px 60px -20px rgba(0,0,0,.6);
  }
  .brand{ display:flex; align-items:center; gap:10px; margin-bottom:20px; }
  .brand .dot{
    width:10px; height:10px; border-radius:2px; background:var(--gold);
    box-shadow:0 0 12px var(--gold); animation: pulse 2s infinite ease-in-out;
  }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.4;} }
  .brand h1{ font-size:13px; letter-spacing:1px; margin:0; color:var(--gold); }
  label{
    display:block; font-size:11px; color:var(--text-dim); margin:16px 0 8px; letter-spacing:.5px; text-transform:uppercase;
  }
  input[type=text]{
    width:100%; padding:12px 14px; border-radius:8px;
    background:var(--bg-deep); border:2px solid var(--line);
    color:var(--text); font-family:'Space Grotesk',sans-serif; font-size:15px;
    outline:none; transition:border-color .15s;
  }
  input[type=text]:focus{ border-color:var(--nebula-soft); }

  .avatar-picker{
    display:flex; align-items:center; justify-content:center; gap:14px; margin-top:6px;
  }
  .arrow-btn{
    width:38px; height:38px; border-radius:50%; border:2px solid var(--line);
    background:var(--bg-deep); color:var(--text); font-size:16px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition:border-color .15s, transform .1s;
    flex:none;
  }
  .arrow-btn:hover{ border-color:var(--nebula-soft); color:var(--nebula-soft); }
  .arrow-btn:active{ transform:scale(.92); }
  .avatar-stage{
    width:150px; height:170px; border-radius:12px;
    background:radial-gradient(circle at 50% 30%, rgba(139,92,246,.18), transparent 70%), var(--bg-deep);
    border:2px solid var(--line);
    display:flex; align-items:center; justify-content:center;
  }
  .avatar-name{
    text-align:center; margin-top:10px; font-size:12.5px; font-weight:700; color:var(--gold); letter-spacing:.4px;
  }
  .avatar-dots{ display:flex; justify-content:center; gap:5px; margin-top:8px; }
  .avatar-dots span{ width:5px; height:5px; border-radius:50%; background:var(--line); }
  .avatar-dots span.on{ background:var(--nebula-soft); }

  .btn{
    margin-top:24px; width:100%; padding:13px; border-radius:9px; border:none;
    background:var(--nebula); color:#fff; font-weight:700; font-size:14px;
    cursor:pointer; letter-spacing:.3px; transition:background .15s, transform .1s;
  }
  .btn:hover{ background:var(--nebula-soft); }
  .btn:active{ transform:scale(.98); }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .hint{ font-size:11px; color:var(--text-dim); margin-top:10px; line-height:1.5; text-align:center; }

  /* ---------- LOBBY ---------- */
  .lobby-wrap{
    width:min(640px, 94vw); max-height:88vh;
    background:linear-gradient(180deg, var(--bg-panel), var(--bg-panel-2));
    border:2px solid var(--line); border-radius:14px;
    padding:30px 30px 24px; overflow:auto;
  }
  .lobby-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;}
  .lobby-head h1{ font-size:14px; color:var(--gold); margin:0;}
  .who{ font-size:12px; color:var(--text-dim); display:flex; align-items:center; gap:8px;}
  .who b{ color:var(--text); }
  #whoAvatar{ border-radius:6px; }
  .section-title{
    font-size:10px; letter-spacing:1px; text-transform:uppercase; color:var(--text-dim);
    margin:24px 0 10px; display:flex; align-items:center; gap:8px;
  }
  .section-title::after{ content:''; flex:1; height:1px; background:var(--line); }
  .create-row{ display:flex; gap:10px; }
  .create-row input{ flex:1; }
  .create-row .btn{ width:auto; margin-top:0; padding:0 18px; white-space:nowrap; }
  .room-list{ display:flex; flex-direction:column; gap:8px; }
  .room-item{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--bg-deep); border:1px solid var(--line); border-radius:9px;
    padding:12px 14px; cursor:pointer; transition:border-color .12s, transform .1s;
  }
  .room-item:hover{ border-color:var(--nebula-soft); transform:translateX(2px); }
  .room-item .rn{ font-weight:600; font-size:14px; }
  .room-item .rm{ font-size:11px; color:var(--text-dim); margin-top:2px; }
  .room-item .go{ font-size:11px; color:var(--gold); }
  .empty{ font-size:12px; color:var(--text-dim); padding:14px 0; text-align:center; }

  /* ---------- ROOM (GAME) ---------- */
  #room-screen{ display:none; width:100%; height:100%; }
  .room-layout{ display:flex; width:100%; height:100%; }
  .stage-wrap{ flex:1; display:flex; align-items:center; justify-content:center; position:relative; padding:18px; }
  #topbar{
    position:absolute; top:14px; left:18px; right:18px;
    display:flex; align-items:center; justify-content:space-between; z-index:5; pointer-events:none;
  }
  #topbar .rname{
    background:rgba(10,14,39,.75); border:1px solid var(--line); border-radius:8px;
    padding:8px 14px; font-size:12px; backdrop-filter:blur(4px); pointer-events:auto;
  }
  #topbar .rname b{ color:var(--gold); }
  #leaveBtn{
    pointer-events:auto;
    background:rgba(10,14,39,.75); border:1px solid var(--line); color:var(--text);
    border-radius:8px; padding:8px 14px; font-size:12px; cursor:pointer;
  }
  #leaveBtn:hover{ border-color:var(--pink); color:var(--pink); }
  canvas#game{
    border-radius:12px; border:2px solid var(--line); background:#0d1230;
    max-width:100%; max-height:100%; box-shadow: 0 20px 50px -20px rgba(0,0,0,.7);
  }
  #controls-hint{
    position:absolute; bottom:14px; left:18px;
    background:rgba(10,14,39,.75); border:1px solid var(--line); border-radius:8px;
    padding:7px 12px; font-size:10.5px; color:var(--text-dim);
  }
  #clickToFocus{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    background:rgba(10,14,39,.92); border:2px solid var(--nebula-soft); border-radius:10px;
    padding:12px 18px; font-size:12.5px; color:var(--text); cursor:pointer; z-index:6;
    box-shadow:0 0 24px rgba(139,92,246,.35);
  }
  canvas#game:focus{ outline:2px solid var(--nebula-soft); }
  #dpad{
    position:absolute; bottom:14px; right:18px; z-index:5;
    width:110px; height:110px;
    display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr);
    gap:4px;
  }
  .dpad-btn{
    background:rgba(10,14,39,.75); border:1px solid var(--line); color:var(--text);
    border-radius:8px; font-size:14px; cursor:pointer; user-select:none;
    display:flex; align-items:center; justify-content:center;
  }
  .dpad-btn:active, .dpad-btn.pressed{ background:var(--nebula); border-color:var(--nebula-soft); }
  .dp-up{ grid-column:2; grid-row:1; }
  .dp-left{ grid-column:1; grid-row:2; }
  .dp-down{ grid-column:2; grid-row:3; }
  .dp-right{ grid-column:3; grid-row:2; }
  @media (max-width: 760px){
    #dpad{ width:130px; height:130px; }
  }
  .side{
    width:290px; min-width:260px; height:100%;
    background:var(--bg-panel); border-left:2px solid var(--line);
    display:flex; flex-direction:column;
  }
  .side h2{
    font-size:10px; letter-spacing:1px; text-transform:uppercase; color:var(--text-dim);
    padding:16px 16px 10px; margin:0; border-bottom:1px solid var(--line);
  }
  #playerList{ padding:10px 16px; font-size:12.5px; display:flex; flex-direction:column; gap:6px; max-height:130px; overflow:auto; }
  .plrow{ display:flex; align-items:center; gap:8px; }
  .plrow .sw{ width:10px; height:10px; border-radius:3px; flex:none; }
  #chatBox{ flex:1; overflow-y:auto; padding:12px 16px; display:flex; flex-direction:column; gap:10px; }
  .msg{ font-size:13px; line-height:1.4; }
  .msg .nm{ font-weight:700; }
  .msg .tx{ color:var(--text); }
  .msg.system{ color:var(--text-dim); font-style:italic; font-size:12px; }
  #chatForm{ display:flex; gap:8px; padding:12px; border-top:1px solid var(--line); }
  #chatInput{
    flex:1; background:var(--bg-deep); border:1px solid var(--line); border-radius:8px;
    padding:10px 12px; color:var(--text); font-family:inherit; font-size:13px; outline:none;
  }
  #chatInput:focus{ border-color:var(--nebula-soft); }
  #sendBtn{
    background:var(--nebula); border:none; border-radius:8px; padding:0 14px; color:#fff; cursor:pointer; font-size:13px; font-weight:600;
  }
  #sendBtn:hover{ background:var(--nebula-soft); }

  @media (max-width: 760px){
    .side{ width:230px; min-width:200px; }
    #controls-hint{ display:none; }
  }
</style>
</head>
<body>

<canvas id="stars"></canvas>

<div id="app">

  <!-- LOGIN -->
  <div class="screen" id="login-screen">
    <div class="card">
      <div class="brand"><div class="dot"></div><h1 class="pixel">NÉBULA</h1></div>
      <label for="nameInput">Seu nome</label>
      <input type="text" id="nameInput" maxlength="16" placeholder="Como querem te chamar?">

      <label>Escolha seu personagem</label>
      <div class="avatar-picker">
        <button class="arrow-btn" id="prevAvatar">&#8592;</button>
        <div class="avatar-stage"><canvas id="avatarPreview" width="120" height="150"></canvas></div>
        <button class="arrow-btn" id="nextAvatar">&#8594;</button>
      </div>
      <div class="avatar-name" id="avatarName">—</div>

      <button class="btn" id="toLobbyBtn" disabled>Entrar na praça</button>

    </div>
  </div>

      </div>

      <div class="section-title">criar sala</div>
      <div class="create-row">
        <input type="text" id="roomNameInput" maxlength="24" placeholder="Nome da sua sala (ex: Cantinho do Zé)">

      <div class="section-title">salas abertas</div>

  <div id="room-screen">

      <div class="stage-wrap">
        <div id="topbar">
          <div class="rname">você está em <b id="currentRoomName"></b></div>
          <button id="leaveBtn">← sair da sala</button>
        </div>
        <canvas id="game" width="760" height="520" tabindex="0"></canvas>
        <div id="clickToFocus">clique aqui pra ativar o teclado</div>
        <div id="controls-hint">WASD / setas para andar · Enter para conversar</div>
        <div id="dpad">
          <button type="button" class="dpad-btn dp-up" data-key="w">▲</button>
          <button type="button" class="dpad-btn dp-left" data-key="a">◀</button>
          <button type="button" class="dpad-btn dp-down" data-key="s">▼</button>
          <button type="button" class="dpad-btn dp-right" data-key="d">▶</button>
        </div>
      </div>
      <div class="side">
        <h2>quem está aqui (<span id="playerCount">0</span>)</h2>
        <div id="playerList"></div>
        <h2 style="border-top:1px solid var(--line);">conversa</h2>

        <form id="chatForm">
          <input type="text" id="chatInput" maxlength="140" placeholder="Diga algo…" autocomplete="off">
          <button type="button" id="sendBtn">Enviar</button>

      </div>

  </div>

</div>

<script>
/* ================= STARFIELD BACKGROUND ================= */
(function(){
  const c = document.getElementById('stars');
  const ctx = c.getContext('2d');
  let stars = [];
  function resize(){
    c.width = window.innerWidth; c.height = window.innerHeight;
    stars = Array.from({length:140}, ()=>({
      x:Math.random()*c.width, y:Math.random()*c.height,
      r:Math.random()*1.4+0.2, s:Math.random()*0.5+0.15, p:Math.random()*Math.PI*2
    }));
  }
  window.addEventListener('resize', resize); resize();
  function loop(t){
    ctx.clearRect(0,0,c.width,c.height);
    for(const st of stars){
      const alpha = 0.35 + 0.5*Math.abs(Math.sin(t*0.001*st.s + st.p));
      ctx.fillStyle = `rgba(180,190,255,${alpha})`;
      ctx.fillRect(st.x, st.y, st.r*2, st.r*2);
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();

/* ================= AVATAR DEFINITIONS (original chibi designs) ================= */
// Each avatar is drawn procedurally with canvas shapes — not copied art.
const AVATARS = [
  {name:'Programador', skin:'#f0c49c', hair:'#22262f', hairStyle:'short',  outfit:'#2f3b63', outfit2:'#1c2544', accessory:'glasses'},
  {name:'Sonhadora',   skin:'#f7d3b0', hair:'#e8c15a', hairStyle:'long',   outfit:'#eaeaf5', outfit2:'#c9b6e8', accessory:'none'},
  {name:'Roqueiro',    skin:'#d99a6c', hair:'#3a2418', hairStyle:'mohawk', outfit:'#8b5cf6', outfit2:'#5b3a9e', accessory:'none'},
  {name:'Skatista',    skin:'#f0c49c', hair:'#7a4a2b', hairStyle:'cap',    outfit:'#ff6fa5', outfit2:'#c94a7d', accessory:'cap'},
  {name:'Viajante',    skin:'#c98857', hair:'#101010', hairStyle:'curly', outfit:'#ffc857', outfit2:'#c99a2f', accessory:'none'},
  {name:'Artista',     skin:'#f7d3b0', hair:'#b23b5a', hairStyle:'bob',   outfit:'#38bdf8', outfit2:'#1f7fae', accessory:'none'},
  {name:'Ciclista',    skin:'#e0aa78', hair:'#4a3323', hairStyle:'short', outfit:'#4ade80', outfit2:'#2f9e5c', accessory:'glasses'},
  {name:'Fotógrafa',   skin:'#f0c49c', hair:'#1c1c1c', hairStyle:'long',  outfit:'#f97316', outfit2:'#b6520f', accessory:'none'}
];

function drawChibi(c, x, y, def, opts){
  opts = opts || {};
  const scale = opts.scale || 1;
  const dir = opts.dir || 'down';
  const legPhase = opts.legPhase || 0;
  const isMe = !!opts.isMe;
  c.save();
  c.translate(x, y);
  c.scale(scale, scale);

  // shadow
  c.fillStyle = 'rgba(0,0,0,0.35)';
  c.beginPath(); c.ellipse(0, 34, 15, 5, 0, 0, Math.PI*2); c.fill();

  // legs (swing when walking)
  const swing = Math.sin(legPhase) * 6;
  c.fillStyle = def.outfit2;
  roundRectPath(c, -9, 12, 7, 18 + Math.max(0,swing*0.4), 3);
  c.fill();
  roundRectPath(c, 2, 12, 7, 18 + Math.max(0,-swing*0.4), 3);
  c.fill();

  // torso
  c.fillStyle = def.outfit;
  roundRectPath(c, -12, -8, 24, 24, 7);
  c.fill();

  // arms
  c.fillStyle = def.outfit;
  roundRectPath(c, -16, -6, 6, 16, 3); c.fill();
  roundRectPath(c, 10, -6, 6, 16, 3); c.fill();

  // neck/head
  c.fillStyle = def.skin;
  c.beginPath(); c.arc(0, -16, 11, 0, Math.PI*2); c.fill();

  // hair (behind/around head depending on style)
  c.fillStyle = def.hair;
  if(def.hairStyle==='short'){
    c.beginPath(); c.arc(0,-19,11.5,Math.PI,Math.PI*2); c.fill();
  } else if(def.hairStyle==='long'){
    c.beginPath(); c.arc(0,-19,11.5,Math.PI,Math.PI*2); c.fill();
    roundRectPath(c,-13,-20,5,22,3); c.fill();
    roundRectPath(c,8,-20,5,22,3); c.fill();
  } else if(def.hairStyle==='mohawk'){
    c.beginPath(); c.arc(0,-19,10,Math.PI*0.15,Math.PI*0.85,true); c.fill();
    roundRectPath(c,-2,-30,4,12,2); c.fill();
  } else if(def.hairStyle==='cap'){
    roundRectPath(c,-12,-27,24,9,4); c.fill();
    roundRectPath(c,-2,-20,16,5,2); c.fill();
  } else if(def.hairStyle==='curly'){
    for(let i=-1;i<=1;i++){
      c.beginPath(); c.arc(i*7,-25,6,0,Math.PI*2); c.fill();
    }
    c.beginPath(); c.arc(0,-19,11.5,Math.PI,Math.PI*2); c.fill();
  } else if(def.hairStyle==='bob'){
    c.beginPath(); c.arc(0,-18,12,Math.PI*0.9,Math.PI*2.1); c.fill();
  }

  // face
  c.fillStyle = 'rgba(30,20,15,0.85)';
  if(dir!=='up'){
    let ex = dir==='left' ? -3 : dir==='right' ? 3 : 0;
    c.beginPath(); c.arc(-4+ex,-16,1.6,0,Math.PI*2); c.fill();
    c.beginPath(); c.arc(4+ex,-16,1.6,0,Math.PI*2); c.fill();
  }

  // accessory
  if(def.accessory==='glasses' && dir!=='up'){
    c.fillStyle='rgba(20,20,25,0.9)';
    roundRectPath(c,-8,-18,7,4,1.5); c.fill();
    roundRectPath(c,1,-18,7,4,1.5); c.fill();
  }
  if(def.accessory==='cap'){
    c.fillStyle = def.outfit2;
    roundRectPath(c,-12,-29,24,7,4); c.fill();
    roundRectPath(c,4,-24,10,4,2); c.fill();
  }

  c.restore();
}
function roundRectPath(c,x,y,w,h,r){
  c.beginPath();
  c.moveTo(x+r,y);
  c.arcTo(x+w,y,x+w,y+h,r);
  c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);
  c.arcTo(x,y,x+w,y,r);
  c.closePath();
}

/* ---- avatar carousel on login ---- */
let avatarIndex = 0;
const avatarPreviewCanvas = document.getElementById('avatarPreview');
const avatarPreviewCtx = avatarPreviewCanvas.getContext('2d');
let previewLegPhase = 0;
function renderAvatarPreview(t){
  previewLegPhase += 0.05;
  avatarPreviewCtx.clearRect(0,0,120,150);
  drawChibi(avatarPreviewCtx, 60, 90, AVATARS[avatarIndex], {scale:2.1, dir:'down', legPhase: Math.sin(previewLegPhase)*1.2, isMe:true});
  requestAnimationFrame(renderAvatarPreview);
}
requestAnimationFrame(renderAvatarPreview);

function renderAvatarDots(){
  const el = document.getElementById('avatarDots');
  el.innerHTML='';
  AVATARS.forEach((a,i)=>{
    const d = document.createElement('span');
    if(i===avatarIndex) d.className='on';
    el.appendChild(d);
  });
}
function updateAvatarLabel(){
  document.getElementById('avatarName').textContent = AVATARS[avatarIndex].name;
  renderAvatarDots();
}
document.getElementById('prevAvatar').addEventListener('click', ()=>{
  avatarIndex = (avatarIndex - 1 + AVATARS.length) % AVATARS.length;
  updateAvatarLabel();
});
document.getElementById('nextAvatar').addEventListener('click', ()=>{
  avatarIndex = (avatarIndex + 1) % AVATARS.length;
  updateAvatarLabel();
});
updateAvatarLabel();

/* ================= IDENTITY ================= */
let myId = null, myName = '', myAvatarIndex = 0;

async function loadIdentity(){
  try{
    const raw = localStorage.getItem('nebula_identity');
    if(raw){
      const d = JSON.parse(raw);
      myId = d.id; myName = d.name || ''; myAvatarIndex = (d.avatarIndex!=null) ? d.avatarIndex : 0;
    }
  }catch(e){ /* no identity yet */ }
  if(!myId){ myId = 'p_' + Math.random().toString(36).slice(2,10); }
}
async function saveIdentity(){
  try{ localStorage.setItem('nebula_identity', JSON.stringify({id:myId,name:myName,avatarIndex:myAvatarIndex})); }catch(e){}
}

/* ================= LOGIN SCREEN ================= */
const nameInput = document.getElementById('nameInput');
const toLobbyBtn = document.getElementById('toLobbyBtn');
nameInput.addEventListener('input', ()=>{
  toLobbyBtn.disabled = nameInput.value.trim().length === 0;
});
toLobbyBtn.addEventListener('click', async ()=>{
  myName = nameInput.value.trim().slice(0,16) || 'Visitante';
  myAvatarIndex = avatarIndex;
  await saveIdentity();
  document.getElementById('login-screen').style.display='none';
  document.getElementById('lobby-screen').style.display='flex';
  document.getElementById('who-name').textContent = myName;
  const whoCtx = document.getElementById('whoAvatar').getContext('2d');
  whoCtx.clearRect(0,0,26,32);
  drawChibi(whoCtx, 13, 22, AVATARS[myAvatarIndex], {scale:0.55, dir:'down'});
  refreshRoomList();
});

/* ================= LOBBY: ROOMS ================= */
const roomListEl = document.getElementById('roomList');
const DEFAULT_ROOM = {id:'praca-central', name:'Praça Central', system:true};

async function getRoomList(){
  try{
    const snap = await db.ref('rooms').once('value');
    const val = snap.val() || {};
    return Object.keys(val)
      .filter(id => id !== DEFAULT_ROOM.id && val[id].meta)
      .map(id => ({id, name: val[id].meta.name, owner: val[id].meta.owner, createdAt: val[id].meta.createdAt}))
      .sort((a,b)=> (b.createdAt||0) - (a.createdAt||0));
  }catch(e){ console.error('getRoomList error', e); return []; }
}
async function refreshRoomList(){
  const rooms = await getRoomList();
  renderRoomList([DEFAULT_ROOM, ...rooms]);
}
function renderRoomList(rooms){
  roomListEl.innerHTML='';
  if(rooms.length===0){
    roomListEl.innerHTML = '<div class="empty">nenhuma sala ainda — crie a primeira!</div>';
    return;
  }
  rooms.forEach(room=>{
    const item = document.createElement('div');
    item.className='room-item';
    item.innerHTML = `<div><div class="rn">${escapeHtml(room.name)}</div>
      <div class="rm">${room.system ? 'sala padrão, sempre aberta' : 'criada por ' + escapeHtml(room.owner||'alguém')}</div></div>
      <div class="go">entrar →</div>`;
    item.onclick = ()=> enterRoom(room.id, room.name);
    roomListEl.appendChild(item);
  });
}
document.getElementById('createRoomBtn').addEventListener('click', async ()=>{
  const input = document.getElementById('roomNameInput');
  const name = input.value.trim().slice(0,24);
  if(!name) return;
  const id = 'r_' + name.toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,20) + '_' + Math.random().toString(36).slice(2,6);
  try{
    await db.ref('rooms/'+id+'/meta').set({name, owner:myName, createdAt: Date.now()});
  }catch(e){ console.error('create room error', e); }
  input.value='';
  enterRoom(id, name);
});

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ================= ROOM / GAME ================= */
let currentRoom = null;
const players = {}; // id -> {name,avatarIndex,x,y,dir,updatedAt,moving,px,py,legPhase,bubbleText,bubbleUntil}
const canvas = document.getElementById('game');
const ctx2d = canvas.getContext('2d');
const WORLD = {w:760, h:520};

const OBSTACLES = [
  {x:70,y:70,w:110,h:60},
  {x:580,y:70,w:110,h:50},
  {x:60,y:400,w:130,h:55},
  {x:560,y:400,w:130,h:60},
  {x:330,y:120,w:100,h:45},
];

let me = {x: WORLD.w/2, y: WORLD.h/2, dir:'down', legPhase:0, moving:false};
const keys = {};
const MOVE_KEYS = ['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'];
function handleKeyDown(e){
  if(document.activeElement === document.getElementById('chatInput')) return;
  const k = e.key.toLowerCase();
  keys[k] = true;
  if(MOVE_KEYS.includes(k)) e.preventDefault();
}
function handleKeyUp(e){
  keys[e.key.toLowerCase()] = false;
}
window.addEventListener('keydown', handleKeyDown);
window.addEventListener('keyup', handleKeyUp);
document.addEventListener('keydown', handleKeyDown);
document.addEventListener('keyup', handleKeyUp);

// click-to-focus so keyboard events reach this window reliably
const clickToFocusEl = document.getElementById('clickToFocus');
function focusGame(){
  canvas.focus();
  if(clickToFocusEl) clickToFocusEl.style.display = 'none';
}
canvas.addEventListener('click', focusGame);
document.getElementById('room-screen').addEventListener('click', focusGame);

// on-screen D-pad (mouse + touch), also useful on mobile
document.querySelectorAll('.dpad-btn').forEach(btn=>{
  const k = btn.getAttribute('data-key');
  const press = (e)=>{ e.preventDefault(); keys[k]=true; btn.classList.add('pressed'); };
  const release = (e)=>{ keys[k]=false; btn.classList.remove('pressed'); };
  btn.addEventListener('mousedown', press);
  btn.addEventListener('touchstart', press, {passive:false});
  btn.addEventListener('mouseup', release);
  btn.addEventListener('mouseleave', release);
  btn.addEventListener('touchend', release);
  btn.addEventListener('touchcancel', release);
});

function collides(x,y){
  const r=13;
  if(x-r<10||x+r>WORLD.w-10||y-r<10||y+r>WORLD.h-10) return true;
  for(const o of OBSTACLES){
    if(x+r>o.x && x-r<o.x+o.w && y+r>o.y && y-r<o.y+o.h) return true;
  }
  return false;
}

function updateMe(dt){
  const speed = 160 * dt;
  let dx=0, dy=0;
  if(keys['w']||keys['arrowup']){ dy-=1; me.dir='up'; }
  if(keys['s']||keys['arrowdown']){ dy+=1; me.dir='down'; }
  if(keys['a']||keys['arrowleft']){ dx-=1; me.dir='left'; }
  if(keys['d']||keys['arrowright']){ dx+=1; me.dir='right'; }
  if(dx!==0 && dy!==0){ dx*=0.7071; dy*=0.7071; }
  me.moving = (dx!==0 || dy!==0);
  if(me.moving) me.legPhase += dt*9; else me.legPhase = 0;
  const nx = me.x + dx*speed, ny = me.y + dy*speed;
  if(!collides(nx, me.y)) me.x = nx;
  if(!collides(me.x, ny)) me.y = ny;
}

function drawRoom(){
  ctx2d.clearRect(0,0,WORLD.w,WORLD.h);
  ctx2d.fillStyle = '#0d1230';
  ctx2d.fillRect(0,0,WORLD.w,WORLD.h);
  ctx2d.strokeStyle = 'rgba(139,92,246,0.10)';
  ctx2d.lineWidth=1;
  for(let x=0;x<WORLD.w;x+=32){ ctx2d.beginPath(); ctx2d.moveTo(x,0); ctx2d.lineTo(x,WORLD.h); ctx2d.stroke(); }
  for(let y=0;y<WORLD.h;y+=32){ ctx2d.beginPath(); ctx2d.moveTo(0,y); ctx2d.lineTo(WORLD.w,y); ctx2d.stroke(); }
  ctx2d.strokeStyle = 'rgba(139,92,246,0.35)';
  ctx2d.lineWidth=3;
  ctx2d.strokeRect(6,6,WORLD.w-12,WORLD.h-12);
  OBSTACLES.forEach(o=>{
    ctx2d.fillStyle = '#1a2150';
    ctx2d.strokeStyle = '#2b3470';
    ctx2d.lineWidth=2;
    roundRectPath(ctx2d,o.x,o.y,o.w,o.h,8);
    ctx2d.fill(); ctx2d.stroke();
  });
}

function drawBubbleAndName(x,y,name,bubbleText){
  ctx2d.font = '11px Space Grotesk, sans-serif';
  ctx2d.textAlign='center';
  ctx2d.fillStyle='rgba(238,240,255,0.9)';
  ctx2d.fillText(name, x, y+38);
  if(bubbleText){
    ctx2d.font='12px Space Grotesk, sans-serif';
    const padding=8;
    let txt=bubbleText;
    if(ctx2d.measureText(txt).width>150){ while(ctx2d.measureText(txt+'…').width>150 && txt.length>1){ txt=txt.slice(0,-1);} txt+='…'; }
    const tw = ctx2d.measureText(txt).width;
    const bw = tw+padding*2, bh=26;
    const bx = x-bw/2, by=y-52;
    ctx2d.fillStyle='rgba(18,24,58,0.95)';
    ctx2d.strokeStyle='rgba(139,92,246,0.6)';
    ctx2d.lineWidth=1.5;
    roundRectPath(ctx2d,bx,by,bw,bh,8);
    ctx2d.fill(); ctx2d.stroke();
    ctx2d.fillStyle='#eef0ff';
    ctx2d.textAlign='center';
    ctx2d.fillText(txt, x, by+17);
  }
}

let lastTime = performance.now();
function gameLoop(t){
  try{
    const dt = Math.min((t-lastTime)/1000, 0.05);
    lastTime = t;
    updateMe(dt);
    drawRoom();
    const now = Date.now();
    Object.values(players).forEach(p=>{
      if(p.id===myId || !p.avatarIndexKnown) return;
      if(now - p.updatedAt > 9000) return;
      if(p.moving) p.legPhase = (p.legPhase||0) + dt*9; else p.legPhase = 0;
      const def = AVATARS[p.avatarIndex] || AVATARS[0];
      drawChibi(ctx2d, p.x, p.y, def, {dir:p.dir, legPhase: Math.sin(p.legPhase||0)*1.2, scale:1});
      const bubble = (p.bubbleUntil && now < p.bubbleUntil) ? p.bubbleText : null;
      drawBubbleAndName(p.x, p.y, p.name, bubble);
    });
    const myDef = AVATARS[myAvatarIndex] || AVATARS[0];
    drawChibi(ctx2d, me.x, me.y, myDef, {dir:me.dir, legPhase: Math.sin(me.legPhase)*1.2, scale:1, isMe:true});
    const myBubble = (myBubbleUntil && now < myBubbleUntil) ? myBubbleText : null;
    drawBubbleAndName(me.x, me.y, myName, myBubble);

    // debug HUD — shows which keys are detected and current position
    const activeKeys = Object.keys(keys).filter(k=>keys[k]).join(' + ') || '(nenhuma)';
    ctx2d.font = '10px monospace';
    ctx2d.textAlign = 'left';
    ctx2d.fillStyle = 'rgba(238,240,255,0.55)';
    ctx2d.fillText(`teclas: ${activeKeys}  |  pos: ${Math.round(me.x)},${Math.round(me.y)}`, 14, WORLD.h-10);
  }catch(err){
    console.error('gameLoop error:', err);
  }
  if(document.getElementById('room-screen').style.display !== 'none'){
    requestAnimationFrame(gameLoop);
  }
}

let myBubbleText=null, myBubbleUntil=0;

let presenceRef=null, playersRef=null, messagesRef=null;
let heartbeatTimer=null;

async function enterRoom(id, name){
  currentRoom = id;
  document.getElementById('lobby-screen').style.display='none';
  document.getElementById('room-screen').style.display='block';
  document.getElementById('currentRoomName').textContent = name;
  me.x = WORLD.w/2 + (Math.random()*60-30);
  me.y = WORLD.h/2 + (Math.random()*60-30);
  let safety = 0;
  while(collides(me.x, me.y) && safety < 50){
    me.x = WORLD.w/2; me.y = WORLD.h/2 + 120; // fallback open spot near bottom-center
    safety++;
    if(safety>1){ me.y += 10; }
  }
  Object.keys(players).forEach(k=>delete players[k]);
  document.getElementById('chatBox').innerHTML='';
  addSystemMsg('você entrou na sala.');

  lastTime = performance.now();
  requestAnimationFrame(gameLoop);
  setTimeout(focusGame, 50);

  // presence: write my state, auto-remove if I disconnect (close tab, lose connection, etc.)
  presenceRef = db.ref(`rooms/${id}/players/${myId}`);
  const initialData = {id:myId, name:myName, avatarIndex:myAvatarIndex, x:Math.round(me.x), y:Math.round(me.y), dir:me.dir, updatedAt:Date.now()};
  try{
    await presenceRef.set(initialData);
    presenceRef.onDisconnect().remove();
  }catch(e){ console.error('presence set error', e); }
  heartbeatTimer = setInterval(pushPresence, 150);

  // live players list
  playersRef = db.ref(`rooms/${id}/players`);
  playersRef.on('value', snap=>{
    const val = snap.val() || {};
    Object.keys(players).forEach(k=>{ if(!val[k]) delete players[k]; });
    Object.keys(val).forEach(pid=>{
      if(pid===myId) return;
      const d = val[pid];
      const prev = players[pid];
      const moving = prev ? (Math.abs(prev.x-d.x)>1 || Math.abs(prev.y-d.y)>1) : false;
      players[pid] = {...prev, ...d, moving, avatarIndexKnown:true};
    });
    updatePlayerListUI();
  });

  // live chat — only new messages from now on for a clean join experience
  messagesRef = db.ref(`rooms/${id}/messages`);
  const joinedAt = Date.now();
  messagesRef.orderByChild('ts').startAt(joinedAt).on('child_added', snap=>{
    const d = snap.val();
    if(!d) return;
    renderChatMsg(d);
    if(d.id!==myId){
      if(!players[d.id]) players[d.id]={};
      players[d.id].bubbleText = d.text;
      players[d.id].bubbleUntil = Date.now()+4500;
    }
  });
}

async function leaveRoom(){
  clearInterval(heartbeatTimer);
  try{
    if(playersRef) playersRef.off();
    if(messagesRef) messagesRef.off();
    if(presenceRef){ await presenceRef.onDisconnect().cancel(); await presenceRef.remove(); }
  }catch(e){ console.error('leave room error', e); }
  presenceRef=null; playersRef=null; messagesRef=null;
  currentRoom = null;
  document.getElementById('room-screen').style.display='none';
  document.getElementById('lobby-screen').style.display='flex';
  refreshRoomList();
}
document.getElementById('leaveBtn').addEventListener('click', leaveRoom);
window.addEventListener('beforeunload', ()=>{ if(presenceRef) presenceRef.remove(); });

async function pushPresence(){
  if(!currentRoom || !presenceRef) return;
  try{
    await presenceRef.update({x:Math.round(me.x), y:Math.round(me.y), dir:me.dir, updatedAt:Date.now()});
  }catch(e){ /* transient network hiccup, ignore */ }
}

function updatePlayerListUI(){
  const now = Date.now();
  const active = Object.values(players).filter(p=>p.id && p.avatarIndexKnown && now-p.updatedAt<9000);
  document.getElementById('playerCount').textContent = active.length+1;
  const el = document.getElementById('playerList');
  el.innerHTML='';
  const myDef = AVATARS[myAvatarIndex] || AVATARS[0];
  const meRow = document.createElement('div');
  meRow.className='plrow';
  meRow.innerHTML = `<div class="sw" style="background:${myDef.outfit}"></div><div>${escapeHtml(myName)} (você)</div>`;
  el.appendChild(meRow);
  active.forEach(p=>{
    const def = AVATARS[p.avatarIndex] || AVATARS[0];
    const row = document.createElement('div');
    row.className='plrow';
    row.innerHTML = `<div class="sw" style="background:${def.outfit}"></div><div>${escapeHtml(p.name||'???')}</div>`;
    el.appendChild(row);
  });
}

function addSystemMsg(text){
  const box = document.getElementById('chatBox');
  const d = document.createElement('div');
  d.className='msg system';
  d.textContent = text;
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
}
function renderChatMsg(d){
  const box = document.getElementById('chatBox');
  const def = AVATARS[d.avatarIndex] || AVATARS[0];
  const el = document.createElement('div');
  el.className='msg';
  el.innerHTML = `<span class="nm" style="color:${def.outfit}">${escapeHtml(d.name)}:</span> <span class="tx">${escapeHtml(d.text)}</span>`;
  box.appendChild(el);
  box.scrollTop = box.scrollHeight;
}

async function sendChatMessage(){
  const input = document.getElementById('chatInput');
  const text = input.value.trim().slice(0,140);
  if(!text || !currentRoom) return;
  input.value='';
  const ts = Date.now();
  const d = {id:myId, name:myName, avatarIndex:myAvatarIndex, text, ts};
  myBubbleText = text; myBubbleUntil = Date.now()+4500;
  try{
    await db.ref(`rooms/${currentRoom}/messages`).push(d);
    // no local renderChatMsg here — the live listener (child_added) renders
    // it for everyone, including me, so it isn't shown twice.
  }catch(err){
    console.error('send message error:', err);
    renderChatMsg(d); // fallback: at least show it to me locally
    addSystemMsg('a mensagem apareceu só pra você — a sincronização com outros jogadores falhou.');
  }
}
document.getElementById('chatForm').addEventListener('submit', e=>{ e.preventDefault(); sendChatMessage(); });
document.getElementById('sendBtn').addEventListener('click', ()=> sendChatMessage());
document.getElementById('chatInput').addEventListener('keydown', e=>{
  if(e.key === 'Enter'){ e.preventDefault(); sendChatMessage(); }
});

/* ================= INIT ================= */
(async function init(){
  await loadIdentity();
  if(myName){
    nameInput.value = myName;
    toLobbyBtn.disabled = false;
    avatarIndex = myAvatarIndex;
    updateAvatarLabel();
  }
})();
</script>
