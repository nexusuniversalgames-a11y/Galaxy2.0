<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nébula — mundo 3D pra andar e conversar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#0a0e27;
    --bg-panel:#12183a;
    --bg-panel-2:#1a2150;
    --line: #2b3470;
    --nebula:#8b5cf6;
    --nebula-soft:#a78bfa;
    --gold:#ffc857;
    --pink:#ff6fa5;
    --text:#eef0ff;
    --text-dim:#9aa3d6;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--bg-deep);
    color:var(--text);
    font-family:'Space Grotesk', sans-serif;
    overflow:hidden;
  }
  .pixel{ font-family:'Press Start 2P', monospace; }
  #stars{ position:fixed; inset:0; z-index:0; pointer-events:none; }
  #app{ position:relative; z-index:1; height:100%; width:100%; display:flex; align-items:center; justify-content:center; }

  /* ---------- LOGIN / LOBBY (unchanged UI chrome) ---------- */
  .screen{ width:100%; height:100%; display:flex; align-items:center; justify-content:center; animation: fadeIn .5s ease; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }
  .card{
    background:linear-gradient(180deg, var(--bg-panel), var(--bg-panel-2));
    border:2px solid var(--line); border-radius:14px; padding:32px 34px;
    width:min(440px, 92vw); box-shadow: 0 0 0 1px rgba(139,92,246,.08), 0 30px 60px -20px rgba(0,0,0,.6);
  }
  .brand{ display:flex; align-items:center; gap:10px; margin-bottom:20px; }
  .brand .dot{ width:10px; height:10px; border-radius:2px; background:var(--gold); box-shadow:0 0 12px var(--gold); animation: pulse 2s infinite ease-in-out; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.4;} }
  .brand h1{ font-size:13px; letter-spacing:1px; margin:0; color:var(--gold); }
  label{ display:block; font-size:11px; color:var(--text-dim); margin:16px 0 8px; letter-spacing:.5px; text-transform:uppercase; }
  input[type=text]{
    width:100%; padding:12px 14px; border-radius:8px; background:var(--bg-deep); border:2px solid var(--line);
    color:var(--text); font-family:'Space Grotesk',sans-serif; font-size:15px; outline:none; transition:border-color .15s;
  }
  input[type=text]:focus{ border-color:var(--nebula-soft); }
  .avatar-picker{ display:flex; align-items:center; justify-content:center; gap:14px; margin-top:6px; }
  .arrow-btn{
    width:38px; height:38px; border-radius:50%; border:2px solid var(--line); background:var(--bg-deep); color:var(--text);
    font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:border-color .15s, transform .1s; flex:none;
  }
  .arrow-btn:hover{ border-color:var(--nebula-soft); color:var(--nebula-soft); }
  .arrow-btn:active{ transform:scale(.92); }
  .avatar-stage{
    width:150px; height:170px; border-radius:12px;
    background:radial-gradient(circle at 50% 30%, rgba(139,92,246,.18), transparent 70%), var(--bg-deep);
    border:2px solid var(--line); overflow:hidden;
  }
  #avatarPreview{ width:100%; height:100%; display:block; }
  .avatar-name{ text-align:center; margin-top:10px; font-size:12.5px; font-weight:700; color:var(--gold); letter-spacing:.4px; }
  .avatar-dots{ display:flex; justify-content:center; gap:5px; margin-top:8px; }
  .avatar-dots span{ width:5px; height:5px; border-radius:50%; background:var(--line); }
  .avatar-dots span.on{ background:var(--nebula-soft); }
  .btn{
    margin-top:24px; width:100%; padding:13px; border-radius:9px; border:none; background:var(--nebula); color:#fff;
    font-weight:700; font-size:14px; cursor:pointer; letter-spacing:.3px; transition:background .15s, transform .1s;
  }
  .btn:hover{ background:var(--nebula-soft); }
  .btn:active{ transform:scale(.98); }
  .btn:disabled{ opacity:.4; cursor:not-allowed; }
  .hint{ font-size:11px; color:var(--text-dim); margin-top:10px; line-height:1.5; text-align:center; }

  .lobby-wrap{
    width:min(640px, 94vw); max-height:88vh;
    background:linear-gradient(180deg, var(--bg-panel), var(--bg-panel-2));
    border:2px solid var(--line); border-radius:14px; padding:30px 30px 24px; overflow:auto;
  }
  .lobby-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;}
  .lobby-head h1{ font-size:14px; color:var(--gold); margin:0;}
  .who{ font-size:12px; color:var(--text-dim); display:flex; align-items:center; gap:8px;}
  .who b{ color:var(--text); }
  #whoAvatar{ width:16px; height:16px; border-radius:4px; display:inline-block; }
  .section-title{ font-size:10px; letter-spacing:1px; text-transform:uppercase; color:var(--text-dim); margin:24px 0 10px; display:flex; align-items:center; gap:8px; }
  .section-title::after{ content:''; flex:1; height:1px; background:var(--line); }
  .create-row{ display:flex; gap:10px; }
  .create-row input{ flex:1; }
  .create-row .btn{ width:auto; margin-top:0; padding:0 18px; white-space:nowrap; }
  .room-list{ display:flex; flex-direction:column; gap:8px; }
  .room-item{
    display:flex; align-items:center; justify-content:space-between; background:var(--bg-deep); border:1px solid var(--line);
    border-radius:9px; padding:12px 14px; cursor:pointer; transition:border-color .12s, transform .1s;
  }
  .room-item:hover{ border-color:var(--nebula-soft); transform:translateX(2px); }
  .room-item .rn{ font-weight:600; font-size:14px; }
  .room-item .rm{ font-size:11px; color:var(--text-dim); margin-top:2px; }
  .room-item .go{ font-size:11px; color:var(--gold); }
  .empty{ font-size:12px; color:var(--text-dim); padding:14px 0; text-align:center; }

  /* ---------- 3D ROOM ---------- */
  #room-screen{ display:none; width:100%; height:100%; position:relative; background:#7ec8e3; }
  #gl{ position:absolute; inset:0; width:100%; height:100%; display:block; outline:none; }
  #loadingHint{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:13px; background:rgba(10,14,39,.4); z-index:20;
  }
  #topbar{
    position:absolute; top:14px; left:18px; right:18px; display:flex; align-items:center; justify-content:space-between; z-index:5;
  }
  #topbar .rname{
    background:rgba(10,14,39,.6); border:1px solid rgba(255,255,255,.15); border-radius:8px;
    padding:8px 14px; font-size:12px; backdrop-filter:blur(4px); color:#fff;
  }
  #topbar .rname b{ color:var(--gold); }
  #leaveBtn{
    background:rgba(10,14,39,.6); border:1px solid rgba(255,255,255,.15); color:#fff;
    border-radius:8px; padding:8px 14px; font-size:12px; cursor:pointer;
  }
  #leaveBtn:hover{ border-color:var(--pink); color:var(--pink); }
  #playerListMini{
    position:absolute; top:60px; right:18px; z-index:5; background:rgba(10,14,39,.6); border:1px solid rgba(255,255,255,.15);
    border-radius:8px; padding:8px 12px; font-size:11.5px; color:#fff; max-width:170px; backdrop-filter:blur(4px);
  }
  #playerListMini .row{ display:flex; align-items:center; gap:6px; margin-top:4px; }
  #playerListMini .sw{ width:8px; height:8px; border-radius:2px; flex:none; }
  #chatFeed{
    position:absolute; bottom:70px; left:18px; z-index:5; width:min(320px, 60vw);
    display:flex; flex-direction:column; gap:4px; pointer-events:none;
  }
  #chatFeed .fmsg{
    background:rgba(10,14,39,.65); border-radius:6px; padding:5px 9px; font-size:12px; color:#fff;
    backdrop-filter:blur(3px); animation: fadeIn .2s ease;
  }
  #chatFeed .fmsg b{ color:var(--gold); }
  #chatFeed .fmsg.system{ color:#cfd4ff; font-style:italic; }
  #controlsHint{
    position:absolute; bottom:14px; right:18px; z-index:5; background:rgba(10,14,39,.6); border:1px solid rgba(255,255,255,.15);
    border-radius:8px; padding:7px 12px; font-size:10.5px; color:#e6e9ff;
  }
  #chatInputWrap{
    position:absolute; bottom:18px; left:50%; transform:translateX(-50%); z-index:10; display:none;
    background:rgba(10,14,39,.85); border:2px solid var(--nebula-soft); border-radius:10px; padding:8px; width:min(420px, 80vw);
  }
  #chatInputWrap input{
    width:100%; background:transparent; border:none; outline:none; color:#fff; font-size:14px; font-family:inherit; padding:6px 10px;
  }
  #playerLabels{ position:absolute; inset:0; z-index:4; pointer-events:none; overflow:hidden; }
  .plabel{ position:absolute; transform:translate(-50%,-100%); pointer-events:none; text-align:center; white-space:nowrap; }
  .plabel .nm{ font-size:11px; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.8); font-weight:600; }
  .plabel .bub{
    background:rgba(10,14,39,.9); border:1px solid rgba(255,255,255,.2); border-radius:8px; padding:4px 9px;
    font-size:12px; color:#fff; margin-bottom:4px; max-width:180px; white-space:normal;
  }
  #dpad{
    position:absolute; bottom:14px; left:18px; z-index:5; width:120px; height:120px;
    display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr); gap:4px;
  }
  .dpad-btn{
    background:rgba(10,14,39,.6); border:1px solid rgba(255,255,255,.2); color:#fff; border-radius:8px;
    font-size:14px; cursor:pointer; user-select:none; display:flex; align-items:center; justify-content:center;
  }
  .dpad-btn:active, .dpad-btn.pressed{ background:var(--nebula); border-color:var(--nebula-soft); }
  .dp-up{ grid-column:2; grid-row:1; } .dp-left{ grid-column:1; grid-row:2; }
  .dp-down{ grid-column:2; grid-row:3; } .dp-right{ grid-column:3; grid-row:2; }
</style>
</head>

<div id="app">

      <button type="button" class="dpad-btn dp-right" data-key="d">▶</button>

    <div id="chatInputWrap">
      <input type="text" id="chatInput" maxlength="140" placeholder="Diga algo… (Enter envia, Esc cancela)" autocomplete="off">

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ================= STARFIELD (login/lobby background) ================= */
(function(){
  const c = document.getElementById('stars');
  const ctx = c.getContext('2d');
  let stars = [];
  function resize(){
    c.width = window.innerWidth; c.height = window.innerHeight;
    stars = Array.from({length:140}, ()=>({
      x:Math.random()*c.width, y:Math.random()*c.height,
      r:Math.random()*1.4+0.2, s:Math.random()*0.5+0.15, p:Math.random()*Math.PI*2
    }));
  }
  window.addEventListener('resize', resize); resize();
  function loop(t){
    ctx.clearRect(0,0,c.width,c.height);
    for(const st of stars){
      const alpha = 0.35 + 0.5*Math.abs(Math.sin(t*0.001*st.s + st.p));
      ctx.fillStyle = `rgba(180,190,255,${alpha})`;
      ctx.fillRect(st.x, st.y, st.r*2, st.r*2);
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();

/* ================= AVATAR DEFINITIONS ================= */
const AVATARS = [
  {name:'Programador', skin:0xf0c49c, hair:0x22262f, outfit:0x2f3b63, outfit2:0x1c2544},
  {name:'Sonhadora',   skin:0xf7d3b0, hair:0xe8c15a, outfit:0xeaeaf5, outfit2:0xc9b6e8},
  {name:'Roqueiro',    skin:0xd99a6c, hair:0x3a2418, outfit:0x8b5cf6, outfit2:0x5b3a9e},
  {name:'Skatista',    skin:0xf0c49c, hair:0x7a4a2b, outfit:0xff6fa5, outfit2:0xc94a7d},
  {name:'Viajante',    skin:0xc98857, hair:0x101010, outfit:0xffc857, outfit2:0xc99a2f},
  {name:'Artista',     skin:0xf7d3b0, hair:0xb23b5a, outfit:0x38bdf8, outfit2:0x1f7fae},
  {name:'Ciclista',    skin:0xe0aa78, hair:0x4a3323, outfit:0x4ade80, outfit2:0x2f9e5c},
  {name:'Fotógrafa',   skin:0xf0c49c, hair:0x1c1c1c, outfit:0xf97316, outfit2:0xb6520f}
];

/* build a low-poly humanoid character with limbs that can swing for a walk cycle */
function buildCharacter(def){
  const g = new THREE.Group();
  const matSkin = new THREE.MeshStandardMaterial({color:def.skin, roughness:0.85});
  const matOutfit = new THREE.MeshStandardMaterial({color:def.outfit, roughness:0.75});
  const matOutfit2 = new THREE.MeshStandardMaterial({color:def.outfit2, roughness:0.75});
  const matHair = new THREE.MeshStandardMaterial({color:def.hair, roughness:0.6});

  const torso = new THREE.Mesh(new THREE.BoxGeometry(0.46,0.56,0.28), matOutfit);
  torso.position.y = 1.02; torso.castShadow = true;
  g.add(torso);

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.21,14,12), matSkin);
  head.position.y = 1.52; head.castShadow = true;
  g.add(head);

  const hair = new THREE.Mesh(new THREE.SphereGeometry(0.225,14,10,0,Math.PI*2,0,Math.PI*0.62), matHair);
  hair.position.y = 1.59;
  g.add(hair);

  function limb(mat, len, rad, x, y){
    const pivot = new THREE.Group();
    pivot.position.set(x,y,0);
    const mesh = new THREE.Mesh(new THREE.CylinderGeometry(rad, rad*0.82, len, 8), mat);
    mesh.position.y = -len/2;
    mesh.castShadow = true;
    pivot.add(mesh);
    g.add(pivot);
    return pivot;
  }
  const armL = limb(matOutfit, 0.40, 0.062, -0.30, 1.28);
  const armR = limb(matOutfit, 0.40, 0.062,  0.30, 1.28);
  const legL = limb(matOutfit2, 0.52, 0.09, -0.12, 0.70);
  const legR = limb(matOutfit2, 0.52, 0.09,  0.12, 0.70);

  g.userData = {armL, armR, legL, legR, walkPhase:0};
  return g;
}
function animateWalk(group, moving, dt){
  const u = group.userData;
  if(moving){ u.walkPhase += dt*7; } else { u.walkPhase *= 0.85; }
  const s = Math.sin(u.walkPhase) * 0.55;
  u.legL.rotation.x = s; u.legR.rotation.x = -s;
  u.armL.rotation.x = -s*0.8; u.armR.rotation.x = s*0.8;
}

/* ---- login preview: small rotating 3D character ---- */
let avatarIndex = 0;
let previewScene, previewCamera, previewRenderer, previewChar, previewActive = true;
function initAvatarPreview(){
  const canvas = document.getElementById('avatarPreview');
  previewScene = new THREE.Scene();
  previewCamera = new THREE.PerspectiveCamera(35, 150/170, 0.1, 20);
  previewCamera.position.set(0, 1.25, 2.6);
  previewCamera.lookAt(0,1.05,0);
  previewRenderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
  previewRenderer.setSize(150,170,false);
  previewRenderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  const hemi = new THREE.HemisphereLight(0xffffff, 0x22264a, 1.0);
  previewScene.add(hemi);
  const dir = new THREE.DirectionalLight(0xffffff, 1.1);
  dir.position.set(2,3,2);
  previewScene.add(dir);
  rebuildAvatarPreviewChar();
  requestAnimationFrame(previewLoop);
}
function rebuildAvatarPreviewChar(){
  if(previewChar) previewScene.remove(previewChar);
  previewChar = buildCharacter(AVATARS[avatarIndex]);
  previewScene.add(previewChar);
}
let previewT = 0;
function previewLoop(t){
  if(previewActive){
    previewT += 0.016;
    if(previewChar){
      previewChar.rotation.y = Math.sin(previewT*0.6)*0.5;
      animateWalk(previewChar, true, 0.016);
    }
    previewRenderer.render(previewScene, previewCamera);
  }
  requestAnimationFrame(previewLoop);
}
initAvatarPreview();

function renderAvatarDots(){
  const el = document.getElementById('avatarDots');
  el.innerHTML='';
  AVATARS.forEach((a,i)=>{
    const d = document.createElement('span');
    if(i===avatarIndex) d.className='on';
    el.appendChild(d);
  });
}
function updateAvatarLabel(){
  document.getElementById('avatarName').textContent = AVATARS[avatarIndex].name;
  renderAvatarDots();
  rebuildAvatarPreviewChar();
}
document.getElementById('prevAvatar').addEventListener('click', ()=>{
  avatarIndex = (avatarIndex - 1 + AVATARS.length) % AVATARS.length;
  updateAvatarLabel();
});
document.getElementById('nextAvatar').addEventListener('click', ()=>{
  avatarIndex = (avatarIndex + 1) % AVATARS.length;
  updateAvatarLabel();
});
updateAvatarLabel();

/* ================= IDENTITY ================= */
let myId = null, myName = '', myAvatarIndex = 0;
async function loadIdentity(){
  try{
    const raw = localStorage.getItem('nebula_identity');
    if(raw){
      const d = JSON.parse(raw);
      myId = d.id; myName = d.name || ''; myAvatarIndex = (d.avatarIndex!=null) ? d.avatarIndex : 0;
    }
  }catch(e){}
  if(!myId){ myId = 'p_' + Math.random().toString(36).slice(2,10); }
}
async function saveIdentity(){
  try{ localStorage.setItem('nebula_identity', JSON.stringify({id:myId,name:myName,avatarIndex:myAvatarIndex})); }catch(e){}
}

/* ================= LOGIN SCREEN ================= */
const nameInput = document.getElementById('nameInput');
const toLobbyBtn = document.getElementById('toLobbyBtn');
nameInput.addEventListener('input', ()=>{ toLobbyBtn.disabled = nameInput.value.trim().length === 0; });
toLobbyBtn.addEventListener('click', async ()=>{
  myName = nameInput.value.trim().slice(0,16) || 'Visitante';
  myAvatarIndex = avatarIndex;
  await saveIdentity();
  previewActive = false;
  document.getElementById('login-screen').style.display='none';
  document.getElementById('lobby-screen').style.display='flex';
  document.getElementById('who-name').textContent = myName;
  document.getElementById('whoAvatar').style.background = '#'+AVATARS[myAvatarIndex].outfit.toString(16).padStart(6,'0');
  refreshRoomList();
});

/* ================= LOBBY: ROOMS ================= */
const roomListEl = document.getElementById('roomList');
const DEFAULT_ROOM = {id:'praca-central', name:'Praça Central', system:true};
async function getRoomList(){
  try{
    const snap = await db.ref('rooms').once('value');
    const val = snap.val() || {};
    return Object.keys(val)
      .filter(id => id !== DEFAULT_ROOM.id && val[id].meta)
      .map(id => ({id, name: val[id].meta.name, owner: val[id].meta.owner, createdAt: val[id].meta.createdAt}))
      .sort((a,b)=> (b.createdAt||0) - (a.createdAt||0));
  }catch(e){ console.error('getRoomList error', e); return []; }
}
async function refreshRoomList(){
  const rooms = await getRoomList();
  renderRoomList([DEFAULT_ROOM, ...rooms]);
}
function renderRoomList(rooms){
  roomListEl.innerHTML='';
  if(rooms.length===0){ roomListEl.innerHTML = '<div class="empty">nenhuma sala ainda — crie a primeira!</div>'; return; }
  rooms.forEach(room=>{
    const item = document.createElement('div');
    item.className='room-item';
    item.innerHTML = `<div><div class="rn">${escapeHtml(room.name)}</div>
      <div class="rm">${room.system ? 'sala padrão, sempre aberta' : 'criada por ' + escapeHtml(room.owner||'alguém')}</div></div>
      <div class="go">entrar →</div>`;
    item.onclick = ()=> enterRoom(room.id, room.name);
    roomListEl.appendChild(item);
  });
}
document.getElementById('createRoomBtn').addEventListener('click', async ()=>{
  const input = document.getElementById('roomNameInput');
  const name = input.value.trim().slice(0,24);
  if(!name) return;
  const id = 'r_' + name.toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,20) + '_' + Math.random().toString(36).slice(2,6);
  try{ await db.ref('rooms/'+id+'/meta').set({name, owner:myName, createdAt: Date.now()}); }catch(e){ console.error(e); }
  input.value='';
  enterRoom(id, name);
});
function escapeHtml(s){
  return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ================= 3D ROOM / GAME ================= */
let currentRoom = null;
let scene, camera, renderer, glCanvas, clock;
let myChar, myMoving=false;
const me = {x:0, z:6, rotY:0, targetRotY:0};
const WORLD_RADIUS = 34;
const remote = {}; // id -> {group, data, targetX, targetZ, targetRotY, labelEl}
const keys = {};
const MOVE_KEYS = ['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'];

function buildWorld(){
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x8fd0ee);
  scene.fog = new THREE.Fog(0x9fdcf0, 20, 70);

  camera = new THREE.PerspectiveCamera(55, 1, 0.1, 200);

  glCanvas = document.getElementById('gl');
  renderer = new THREE.WebGLRenderer({canvas:glCanvas, antialias:true});
  renderer.shadowMap.enabled = true;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));

  const hemi = new THREE.HemisphereLight(0xbfe3ff, 0x3a6b2f, 0.85);
  scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xfff4d6, 1.15);
  sun.position.set(18, 26, 12);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024,1024);
  sun.shadow.camera.left=-40; sun.shadow.camera.right=40;
  sun.shadow.camera.top=40; sun.shadow.camera.bottom=-40;
  scene.add(sun);

  // rolling ground
  const groundGeo = new THREE.PlaneGeometry(140,140,60,60);
  groundGeo.rotateX(-Math.PI/2);
  const pos = groundGeo.attributes.position;
  for(let i=0;i<pos.count;i++){
    const x=pos.getX(i), z=pos.getZ(i);
    const h = Math.sin(x*0.06)*0.6 + Math.cos(z*0.05)*0.6 + Math.sin((x+z)*0.03)*0.4;
    pos.setY(i, h);
  }
  groundGeo.computeVertexNormals();
  const groundMat = new THREE.MeshStandardMaterial({color:0x4fae4a, roughness:1});
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.receiveShadow = true;
  scene.add(ground);

  // scattered flowers (small colored dots) for a touch of the meadow look
  const flowerColors = [0xffc857, 0xffffff, 0xff8fb3];
  const flowerGeo = new THREE.ConeGeometry(0.06,0.16,5);
  for(let i=0;i<160;i++){
    const a = Math.random()*Math.PI*2, r = 4+Math.random()*32;
    const x = Math.cos(a)*r, z = Math.sin(a)*r;
    const mat = new THREE.MeshStandardMaterial({color: flowerColors[i%3]});
    const fl = new THREE.Mesh(flowerGeo, mat);
    fl.position.set(x, groundHeightAt(x,z)+0.08, z);
    fl.castShadow = false;
    scene.add(fl);
  }

  // trees forming a forest border
  function makeTree(x,z,scale){
    const g = new THREE.Group();
    const trunkH = 1.6*scale;
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.14*scale,0.2*scale,trunkH,7), new THREE.MeshStandardMaterial({color:0x6b4a2f, roughness:1}));
    trunk.position.y = trunkH/2; trunk.castShadow = true;
    g.add(trunk);
    const leafMat = new THREE.MeshStandardMaterial({color:0x2f7d3a, roughness:0.9});
    for(let i=0;i<3;i++){
      const cone = new THREE.Mesh(new THREE.ConeGeometry((1.1-i*0.18)*scale, 1.3*scale, 8), leafMat);
      cone.position.y = trunkH + i*0.85*scale;
      cone.castShadow = true;
      g.add(cone);
    }
    g.position.set(x, groundHeightAt(x,z), z);
    scene.add(g);
  }
  for(let i=0;i<46;i++){
    const a = (i/46)*Math.PI*2 + Math.random()*0.15;
    const r = 30 + Math.random()*10;
    makeTree(Math.cos(a)*r, Math.sin(a)*r, 0.8+Math.random()*0.7);
  }
  // a few inner clusters for depth (kept away from the spawn center)
  for(let i=0;i<10;i++){
    const a = Math.random()*Math.PI*2, r = 18+Math.random()*8;
    makeTree(Math.cos(a)*r, Math.sin(a)*r, 0.7+Math.random()*0.5);
  }

  // bushes
  const bushMat = new THREE.MeshStandardMaterial({color:0x2f7d3a, roughness:0.95});
  for(let i=0;i<26;i++){
    const a = Math.random()*Math.PI*2, r = 6+Math.random()*26;
    const x = Math.cos(a)*r, z = Math.sin(a)*r;
    const bush = new THREE.Mesh(new THREE.IcosahedronGeometry(0.5+Math.random()*0.4, 0), bushMat);
    bush.position.set(x, groundHeightAt(x,z)+0.35, z);
    bush.castShadow = true;
    scene.add(bush);
  }
}
function groundHeightAt(x,z){
  return Math.sin(x*0.06)*0.6 + Math.cos(z*0.05)*0.6 + Math.sin((x+z)*0.03)*0.4;
}

function resizeRenderer(){
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w,h,false);
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', ()=>{ if(renderer) resizeRenderer(); });

function handleKeyDown(e){
  const chatInputEl = document.getElementById('chatInput');
  const chatOpen = document.getElementById('chatInputWrap').style.display === 'block';
  if(!chatOpen && e.key === 'Enter' && currentRoom){
    openChatInput();
    e.preventDefault();
    return;
  }
  if(document.activeElement === chatInputEl) return;
  const k = e.key.toLowerCase();
  keys[k] = true;
  if(MOVE_KEYS.includes(k)) e.preventDefault();
}
function handleKeyUp(e){ keys[e.key.toLowerCase()] = false; }
window.addEventListener('keydown', handleKeyDown);
window.addEventListener('keyup', handleKeyUp);
document.addEventListener('keydown', handleKeyDown);
document.addEventListener('keyup', handleKeyUp);

document.querySelectorAll('.dpad-btn').forEach(btn=>{
  const k = btn.getAttribute('data-key');
  const press = (e)=>{ e.preventDefault(); keys[k]=true; btn.classList.add('pressed'); };
  const release = ()=>{ keys[k]=false; btn.classList.remove('pressed'); };
  btn.addEventListener('mousedown', press);
  btn.addEventListener('touchstart', press, {passive:false});
  btn.addEventListener('mouseup', release);
  btn.addEventListener('mouseleave', release);
  btn.addEventListener('touchend', release);
  btn.addEventListener('touchcancel', release);
});

function updateMe(dt){
  let dx=0, dz=0;
  if(keys['w']||keys['arrowup']) dz -= 1;
  if(keys['s']||keys['arrowdown']) dz += 1;
  if(keys['a']||keys['arrowleft']) dx -= 1;
  if(keys['d']||keys['arrowright']) dx += 1;
  myMoving = (dx!==0 || dz!==0);
  if(myMoving){
    const len = Math.hypot(dx,dz); dx/=len; dz/=len;
    me.targetRotY = Math.atan2(dx, dz);
    const speed = 4.2*dt;
    const nx = me.x + dx*speed, nz = me.z + dz*speed;
    if(Math.hypot(nx,nz) < WORLD_RADIUS){ me.x = nx; me.z = nz; }
  }
  // smooth turn toward movement direction
  let diff = me.targetRotY - me.rotY;
  while(diff > Math.PI) diff -= Math.PI*2;
  while(diff < -Math.PI) diff += Math.PI*2;
  me.rotY += diff * Math.min(1, dt*10);

  myChar.position.set(me.x, groundHeightAt(me.x,me.z), me.z);
  myChar.rotation.y = me.rotY;
  animateWalk(myChar, myMoving, dt);

  // third-person chase camera
  const camDist = 4.4, camHeight = 2.2;
  const desired = new THREE.Vector3(
    me.x - Math.sin(me.rotY)*camDist,
    groundHeightAt(me.x,me.z) + camHeight,
    me.z - Math.cos(me.rotY)*camDist
  );
  camera.position.lerp(desired, 1 - Math.pow(0.001, dt));
  const lookAt = new THREE.Vector3(me.x, groundHeightAt(me.x,me.z)+1.15, me.z);
  camera.lookAt(lookAt);
}

function worldToScreen(vec3){
  const v = vec3.clone().project(camera);
  return {
    x: (v.x*0.5+0.5) * glCanvas.clientWidth,
    y: (-v.y*0.5+0.5) * glCanvas.clientHeight,
    behind: v.z > 1
  };
}

const labelsContainer = document.getElementById('playerLabels');
const myLabelEl = document.createElement('div');
myLabelEl.className = 'plabel';
myLabelEl.innerHTML = `<div class="bub" id="myBub" style="display:none;"></div><div class="nm" id="myNm"></div>`;
labelsContainer.appendChild(myLabelEl);
let myBubbleText=null, myBubbleUntil=0;

function updateLabels(){
  const now = Date.now();
  // me
  const myHead = new THREE.Vector3(me.x, groundHeightAt(me.x,me.z)+1.9, me.z);
  const s = worldToScreen(myHead);
  if(!s.behind){
    myLabelEl.style.left = s.x+'px'; myLabelEl.style.top = s.y+'px'; myLabelEl.style.display='block';
    document.getElementById('myNm').textContent = myName;
    const bubEl = document.getElementById('myBub');
    if(myBubbleUntil > now && myBubbleText){ bubEl.style.display='block'; bubEl.textContent = myBubbleText; }
    else bubEl.style.display='none';
  } else { myLabelEl.style.display='none'; }

  // remote players
  Object.keys(remote).forEach(id=>{
    const r = remote[id];
    const head = new THREE.Vector3(r.group.position.x, r.group.position.y+1.9, r.group.position.z);
    const sc = worldToScreen(head);
    if(sc.behind){ r.labelEl.style.display='none'; return; }
    r.labelEl.style.display='block';
    r.labelEl.style.left = sc.x+'px'; r.labelEl.style.top = sc.y+'px';
    const bubEl = r.labelEl.querySelector('.bub');
    if(r.bubbleUntil > now && r.bubbleText){ bubEl.style.display='block'; bubEl.textContent = r.bubbleText; }
    else bubEl.style.display='none';
  });
}

function ensureRemoteChar(id, d){
  if(remote[id]) return remote[id];
  const def = AVATARS[d.avatarIndex] || AVATARS[0];
  const group = buildCharacter(def);
  scene.add(group);
  const labelEl = document.createElement('div');
  labelEl.className = 'plabel';
  labelEl.innerHTML = `<div class="bub" style="display:none;"></div><div class="nm">${escapeHtml(d.name||'???')}</div>`;
  labelsContainer.appendChild(labelEl);
  remote[id] = {
    group, targetX:d.x, targetZ:d.z, targetRotY:d.rotY||0, moving:false, labelEl,
    bubbleText:null, bubbleUntil:0, updatedAt:Date.now(),
    name: d.name||'???', outfitHex: def.outfit
  };
  return remote[id];
}
function removeRemoteChar(id){
  const r = remote[id];
  if(!r) return;
  scene.remove(r.group);
  r.labelEl.remove();
  delete remote[id];
}

let lastTime = performance.now();
function gameLoop(t){
  try{
    const dt = Math.min((t-lastTime)/1000, 0.05);
    lastTime = t;
    updateMe(dt);
    // interpolate remote players toward their networked target position
    Object.values(remote).forEach(r=>{
      const cx = r.group.position.x, cz = r.group.position.z;
      const nx = cx + (r.targetX-cx)*Math.min(1,dt*8);
      const nz = cz + (r.targetZ-cz)*Math.min(1,dt*8);
      r.group.position.set(nx, groundHeightAt(nx,nz), nz);
      let diff = r.targetRotY - r.group.rotation.y;
      while(diff > Math.PI) diff -= Math.PI*2;
      while(diff < -Math.PI) diff += Math.PI*2;
      r.group.rotation.y += diff * Math.min(1, dt*10);
      r.moving = Math.hypot(r.targetX-cx, r.targetZ-cz) > 0.03;
      animateWalk(r.group, r.moving, dt);
    });
    updateLabels();
    renderer.render(scene, camera);
  }catch(err){ console.error('gameLoop error:', err); }
  if(document.getElementById('room-screen').style.display !== 'none'){
    requestAnimationFrame(gameLoop);
  }
}

/* ---- chat input (appears on Enter) ---- */
const chatInputWrap = document.getElementById('chatInputWrap');
const chatInput = document.getElementById('chatInput');
function openChatInput(){
  chatInputWrap.style.display = 'block';
  chatInput.value='';
  chatInput.focus();
}
function closeChatInput(){
  chatInputWrap.style.display = 'none';
  chatInput.blur();
  glCanvas.focus();
}
chatInput.addEventListener('keydown', e=>{
  e.stopPropagation();
  if(e.key === 'Enter'){
    e.preventDefault();
    const text = chatInput.value.trim().slice(0,140);
    closeChatInput();
    if(text) sendChatMessage(text);
  } else if(e.key === 'Escape'){
    e.preventDefault();
    closeChatInput();
  }
});

function addFeedMsg(name, text, system){
  const feed = document.getElementById('chatFeed');
  const el = document.createElement('div');
  el.className = 'fmsg' + (system?' system':'');
  el.innerHTML = system ? escapeHtml(text) : `<b>${escapeHtml(name)}:</b> ${escapeHtml(text)}`;
  feed.appendChild(el);
  while(feed.children.length > 6) feed.removeChild(feed.firstChild);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .6s'; setTimeout(()=>el.remove(),600); }, 8000);
}

async function sendChatMessage(text){
  const d = {id:myId, name:myName, avatarIndex:myAvatarIndex, text, ts:Date.now()};
  myBubbleText = text; myBubbleUntil = Date.now()+4500;
  try{
    await db.ref(`rooms/${currentRoom}/messages`).push(d);
  }catch(err){
    console.error('send message error:', err);
    addFeedMsg(myName, text);
    addFeedMsg(null, 'a mensagem apareceu só pra você — a sincronização falhou.', true);
  }
}

/* ---- room lifecycle ---- */
let presenceRef=null, playersRef=null, messagesRef=null, heartbeatTimer=null;

async function enterRoom(id, name){
  currentRoom = id;
  document.getElementById('lobby-screen').style.display='none';
  document.getElementById('room-screen').style.display='block';
  document.getElementById('currentRoomName').textContent = name;
  document.getElementById('loadingHint').style.display='flex';

  if(!scene){ buildWorld(); }
  resizeRenderer();
  if(myChar) scene.remove(myChar);
  myChar = buildCharacter(AVATARS[myAvatarIndex] || AVATARS[0]);
  scene.add(myChar);

  me.x = (Math.random()*10-5); me.z = (Math.random()*10-5); me.rotY = 0; me.targetRotY = 0;
  Object.keys(remote).forEach(removeRemoteChar);
  document.getElementById('chatFeed').innerHTML='';
  addFeedMsg(null, 'você entrou na sala.', true);

  document.getElementById('loadingHint').style.display='none';
  lastTime = performance.now();
  requestAnimationFrame(gameLoop);
  setTimeout(()=>glCanvas.focus(), 60);

  presenceRef = db.ref(`rooms/${id}/players/${myId}`);
  const initialData = {id:myId, name:myName, avatarIndex:myAvatarIndex, x:me.x, z:me.z, rotY:me.rotY, updatedAt:Date.now()};
  try{ await presenceRef.set(initialData); presenceRef.onDisconnect().remove(); }catch(e){ console.error('presence set error', e); }
  heartbeatTimer = setInterval(pushPresence, 150);

  playersRef = db.ref(`rooms/${id}/players`);
  playersRef.on('value', snap=>{
    const val = snap.val() || {};
    Object.keys(remote).forEach(pid=>{ if(!val[pid]) removeRemoteChar(pid); });
    Object.keys(val).forEach(pid=>{
      if(pid===myId) return;
      const d = val[pid];
      const r = ensureRemoteChar(pid, d);
      r.targetX = d.x; r.targetZ = d.z; r.targetRotY = d.rotY||0; r.updatedAt = d.updatedAt;
    });
    updatePlayerListUI();
  });

  messagesRef = db.ref(`rooms/${id}/messages`);
  const joinedAt = Date.now();
  messagesRef.orderByChild('ts').startAt(joinedAt).on('child_added', snap=>{
    const d = snap.val();
    if(!d) return;
    addFeedMsg(d.name, d.text);
    if(d.id!==myId && remote[d.id]){ remote[d.id].bubbleText = d.text; remote[d.id].bubbleUntil = Date.now()+4500; }
  });
}

async function leaveRoom(){
  clearInterval(heartbeatTimer);
  try{
    if(playersRef) playersRef.off();
    if(messagesRef) messagesRef.off();
    if(presenceRef){ await presenceRef.onDisconnect().cancel(); await presenceRef.remove(); }
  }catch(e){ console.error('leave room error', e); }
  presenceRef=null; playersRef=null; messagesRef=null;
  currentRoom = null;
  document.getElementById('room-screen').style.display='none';
  document.getElementById('lobby-screen').style.display='flex';
  refreshRoomList();
}
document.getElementById('leaveBtn').addEventListener('click', leaveRoom);
window.addEventListener('beforeunload', ()=>{ if(presenceRef) presenceRef.remove(); });

async function pushPresence(){
  if(!currentRoom || !presenceRef) return;
  try{ await presenceRef.update({x:me.x, z:me.z, rotY:me.rotY, updatedAt:Date.now()}); }catch(e){}
}

function updatePlayerListUI(){
  const now = Date.now();
  const active = Object.keys(remote).filter(id => now - remote[id].updatedAt < 9000);
  document.getElementById('playerCount').textContent = active.length+1;
  const rows = document.getElementById('playerListRows');
  rows.innerHTML='';
  const myDef = AVATARS[myAvatarIndex] || AVATARS[0];
  const meRow = document.createElement('div'); meRow.className='row';
  meRow.innerHTML = `<div class="sw" style="background:#${myDef.outfit.toString(16).padStart(6,'0')}"></div><div>${escapeHtml(myName)} (você)</div>`;
  rows.appendChild(meRow);
  active.forEach(id=>{
    const r = remote[id];
    const row = document.createElement('div'); row.className='row';
    row.innerHTML = `<div class="sw" style="background:#${r.outfitHex.toString(16).padStart(6,'0')}"></div><div>${escapeHtml(r.name)}</div>`;
    rows.appendChild(row);
  });
}

/* ================= INIT ================= */
(async function init(){
  await loadIdentity();
  if(myName){
    nameInput.value = myName;
    toLobbyBtn.disabled = false;
    avatarIndex = myAvatarIndex;
    updateAvatarLabel();
  }
})();
